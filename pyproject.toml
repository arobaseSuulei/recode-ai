[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recodeai"
version = "0.1.0"
description = "A local coding agent harness"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
recode = "recode.cli:main"

[tool.setuptools.packages.find]
where = ["src"]