[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recodeai"
version = "0.1.0"
description = "A lightweight coding agent CLI built with smolagents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "smolagents[openai]",
    "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
recode = "recode.cli:main"